# RabbitMQ release series used by repository setup and upgrade safety checks.
rabbitmq_release: "4.2"

# Direct in-place upgrade paths supported by RabbitMQ release-series docs.
# Patch upgrades within the same release series are always allowed.
rabbitmq_supported_direct_release_upgrades:
  - ["3.7", "3.8"]
  - ["3.8", "3.9"]
  - ["3.9", "3.10"]
  - ["3.10", "3.11"]
  - ["3.12", "3.13"]
  - ["3.13", "4.0"]
  - ["3.13", "4.1"]
  - ["3.13", "4.2"]
  - ["4.0", "4.1"]
  - ["4.0", "4.2"]
  - ["4.1", "4.2"]
  - ["4.2", "4.3"]

# Erlang major release to use for direct aarch64 RPM installs. Keep these on
# fully supported Erlang lines for the RabbitMQ release series used by the role.
rabbitmq_erlang_aarch64_major_release_by_rabbitmq_release:
  "3.11": "25"
  "3.12": "26"
  "3.13": "26"
  "4.0": "27"
  "4.1": "27"
  "4.2": "27"
  "4.3": "27"
