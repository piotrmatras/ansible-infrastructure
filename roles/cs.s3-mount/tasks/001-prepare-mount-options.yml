- name: Initialize S3 mount options
  set_fact:
    s3_mount_opts: "{{ s3_mount_opts_base }}"

- name: Enable S3 mount cache
  set_fact:
    s3_mount_opts: "{{ s3_mount_opts + _s3_mount_cache_opts }}"
  vars:
    _s3_mount_cache_opts: >-
      {{
        (s3_mount_backend == 'rclone') | ternary(
          ['vfs_cache_mode=writes', 'cache_dir=' ~ s3fs_cache_dir],
          ['use_cache=' ~ s3fs_cache_dir]
        )
      }}
  when: s3fs_use_cache and s3_mount_uses_cache

- name: Disable rclone VFS cache when local cache is disabled
  set_fact:
    s3_mount_opts: "{{ s3_mount_opts + ['vfs_cache_mode=off'] }}"
  when: s3_mount_backend == 'rclone' and not s3fs_use_cache
